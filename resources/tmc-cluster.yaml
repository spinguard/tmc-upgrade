apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: tmc
    run.tanzu.vmware.com/tkr: v1.36.1---vmware.4-vkr.5
  name: tmc
  namespace: tmc-sm
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 100.67.0.0/16
    serviceDomain: cluster.local
    services:
      cidrBlocks:
      - 10.97.0.0/16
  topology:
    class: builtin-generic-v3.7.0
    classNamespace: vmware-system-vks-public
    controlPlane:
      metadata: {}
      replicas: 3
      variables:
        overrides:
        - name: vmClass
          value: best-effort-large
        - name: volumes
          value:
          - capacity: 40G
            mountPath: /var/lib/containerd
            name: containerd
            storageClass: nfs-pool-1-policy
    variables:
      - name: volumes
        value: []
      - name: storageClass
        value: nfs-pool-1-policy
      - name: vmClass
        value: ""
      - name: vsphereOptions
        value:
          persistentVolumes:
            defaultStorageClass: nfs-pool-1-policy
      - name: kubernetes
        value:
          certificateRotation:
            enabled: true
            renewalDaysBeforeExpiry: 90
      - name: osConfiguration
        value:
          trust:
            additionalTrustedCAs:
              - caCert:
                  secretRef:
                    key: ca.crt
                    name: harbor-ca
    version: v1.36.1---vmware.4-vkr.5
    workers:
      machineDeployments:
      - class: node-pool
        metadata: {}
        name: md-0
        replicas: 3
        variables:
          overrides:
          - name: vmClass
            value: best-effort-large
          - name: volumes
            value:
            - capacity: 40G
              mountPath: /var/lib/containerd
              name: containerd
              storageClass: nfs-pool-1-policy
